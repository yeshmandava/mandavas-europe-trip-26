<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17362f"><title>Mandava’s Europe Trip 26’</title><style>body{margin:0;background:#fbfaf6;color:#17362f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:24px 16px 90px;max-width:760px;margin:auto}.hero{padding:26px 18px;background:#f4efe5}.hero h1{font:600 38px Georgia,serif;margin:5px 0}.hero p{color:#718078}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 14px;border-bottom:1px solid #deddd5;background:#fff}.tabs button{border:1px solid #deddd5;background:#fff;border-radius:18px;padding:9px 11px;white-space:nowrap}.tabs .on{background:#17362f;color:#fff}.card{background:#fff;border:1px solid #deddd5;border-radius:16px;padding:14px;margin-bottom:12px}.now{background:linear-gradient(135deg,#17362f,#285148);color:#fff}.now small{color:#dbc59e;font-weight:800;letter-spacing:.08em}.now h2{font:600 23px Georgia,serif;margin:5px 0}.wx{display:grid;grid-template-columns:repeat(3,minmax(115px,1fr));gap:8px;overflow:auto}.wx .card{min-width:115px}.wx .emoji{font-size:25px}.timeline .item{display:grid;grid-template-columns:32px 72px minmax(0,1fr);gap:8px;padding:14px 0;border-bottom:1px solid #deddd5}.timeline .item:last-child{border:0}.timeline h3{font-size:13px;margin:0 0 4px}.timeline p{font-size:10px;color:#718078;line-height:1.45;margin:0}.bits{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.bits div{background:#f8f6f0;border-radius:8px;padding:7px;font-size:8px;color:#718078}.bits b{display:block;color:#17362f;font-size:7px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions a{border:1px solid #deddd5;border-radius:999px;padding:7px 9px;text-decoration:none;color:#17362f;font-size:9px;font-weight:800}.actions .uber{background:#111;color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fbfaf6f5;border-top:1px solid #deddd5;padding:8px 8px max(8px,env(safe-area-inset-bottom))}.bottom button{border:0;background:none;min-height:54px;font-size:11px;color:#718078}.bottom .on{background:#edf2eb;color:#17362f;border-radius:12px;font-weight:800}.port summary{cursor:pointer;font-weight:800}.port details{margin-top:8px}.checklist label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid #deddd5;font-size:12px}.muted{color:#718078;font-size:10px}@media(max-width:390px){.bits{grid-template-columns:1fr}.timeline .item{grid-template-columns:28px 62px minmax(0,1fr)}} </style></head><body><section class="hero"><small>MANDAVA’S EUROPE TRIP · 26’</small><h1>Mandava’s Europe Trip 26’</h1><p>Lisbon, Porto, Sintra, Belém and Silver Muse.</p></section><div id="tabs" class="tabs"></div><main id="app"></main><nav class="bottom"><button id="bToday" class="on" onclick="view='today';render()">⌂<br>Today</button><button id="bCruise" onclick="view='cruise';render()">⚓<br>Cruise</button><button id="bLocal" onclick="view='local';render()">◎<br>Local</button><button id="bList" onclick="view='list';render()">✓<br>List</button></nav><script>const days=[{date:'Mon, Aug 17',place:'Lisbon',items:[['07:45–09:00','☕','Hotel breakfast + reset','Leave bags at Meliá, eat, hydrate and keep valuables with you.','Keep passports/valuables with you.','Portuguese coffee + light breakfast.','Meliá Lisboa Oriente Lisbon'],['09:00–10:30','🌊','Parque das Nações','Walk the riverfront around Oriente and the marina.','Oriente Station roof + Tagus promenade.','Easy jet-lag buffer.','Parque das Nações Lisbon'],['11:30–12:30','🏛️','Praça do Comércio → Rua Augusta','Walk the grand river square through Baixa.','Yellow arcades, river steps, Baixa grid.','Skip Santa Justa queue.','Praça do Comércio Lisbon'],['12:30–13:30','🍕','Lunch: Lupita','Family lunch with vegetarian/vegan options.','Cais do Sodré area.','Share pizzas family-style.','Lupita Lisbon'],['13:40–14:15','🏺','Chiado + Cerâmicas na Linha','Short ceramics-shopping stop.','Portuguese ceramics and tiles.','Cap at 20–30 minutes.','Cerâmicas na Linha Lisbon'],['14:30–16:30','🏘️','Alfama + Lisbon Cathedral','Ride uphill, then walk downhill through Alfama.','Santa Luzia, tiled façades, Sé.','Wander one or two side streets.','Miradouro de Santa Luzia Lisbon'],['16:45–17:30','🌇','Senhora do Monte · optional','Broad city panorama if everyone has energy.','Castle, Baixa and Tagus view.','Ride uphill.','Miradouro da Senhora do Monte Lisbon'],['18:30–20:00','🍽️','Dinner: Rosa da Rua','Portuguese buffet-style dinner with vegetarian options.','Bairro Alto evening atmosphere.','Sample several dishes.','Rosa da Rua Lisbon']]},{date:'Tue, Aug 18',place:'Porto',items:[['08:09–10:55','🚆','First Class to Campanhã','Use the train as downtime.','Keep tickets and ID ready.','Save the main meal for Porto.','Porto Campanhã Station'],['11:05–11:35','🚕','Ride to Porto Cathedral','Go straight to the high point.','Sé terrace + panorama.','Makes the day mostly downhill.','Porto Cathedral'],['11:35–12:30','🌉','Dom Luís I → Jardim do Morro','Cross the upper deck toward Gaia.','Ribeira roofs + Douro.','Add Serra do Pilar only if moving well.','Jardim do Morro Porto'],['12:30–13:30','🥗','Veg-inclusive lunch','daTerra Baixa is the safest mixed-family choice.','Keep lunch near one hour.','Casa Guedes optional for meat eaters.','daTerra Baixa Porto'],['13:30–14:15','🌊','Ribeira waterfront','Slow down along the riverfront.','Cais da Ribeira + lower bridge.','Coffee or cold drink.','Ribeira Porto'],['14:15–15:00','⛴️','Six Bridges cruise · optional','Do it only if queues are short.','River-level city perspective.','First thing to cut if timing slips.','Ribeira Porto'],['15:00–16:20','🚶','Rua das Flores → São Bento','Walk inland and enter São Bento.','Blue-and-white azulejo panels.','Fábrica da Nata nearby.','São Bento Station Porto'],['17:25–18:40','🚕','Campanhã buffer + return train','Ride to Campanhã early.','18:40 is the hard stop.','Buy water/snacks at station.','Porto Campanhã Station']]},{date:'Wed, Aug 19',place:'Sintra',items:[['07:40–09:20','🚆','Oriente → Sintra','Take the commuter train and conserve energy.','Go straight to your transport plan.','Keep tickets downloaded.','Sintra Station Portugal'],['10:00–12:00','🌿','Monserrate Palace & Park','Give gardens and palace a real two hours.','Central hall, lawns, exotic planting.','Follow current access signs.','Monserrate Palace Sintra'],['12:45–13:40','🥙','Quick veg-inclusive lunch','Piadina’s is fast and mixed-diet friendly.','Stay near the historic center.','Vegan artisan burger is a safe option.',"Piadina's Wine & Co Sintra"],['13:40–14:15','🏘️','Historic center → Regaleira','Walk to Quinta da Regaleira and arrive early.','National Palace exterior if timing permits.','Do not join another attraction line.','Quinta da Regaleira Sintra'],['14:30–16:30','🌀','Quinta da Regaleira','The day’s fixed anchor.','Initiation Well, tunnels, grottoes, chapel.','Shoes with grip help.','Quinta da Regaleira Sintra'],['16:30–17:20','🥐','Casa Piriquita','Classic Sintra pastry stop.','Historic center atmosphere.','Share one travesseiro + one queijada.','Casa Piriquita Sintra']]},{date:'Thu, Aug 20',place:'Belém + Silver Muse',items:[['07:30–08:30','☕','Breakfast + finish packing','Eat, hydrate and have cruise documents ready.','Final safe/outlet/bathroom sweep.','Keep passports and medications in hand luggage.','Meliá Lisboa Oriente Lisbon'],['08:30–09:00','🧳','Check out + store luggage','Leave cruise luggage securely with Meliá.','Confirm every bag is tagged.','Take only a light day bag to Belém.','Meliá Lisboa Oriente Lisbon'],['09:00–09:40','🚕','Uber to Belém / MAAT','Ride directly west to MAAT.','Tagus riverfront + MAAT exterior.','Use spare pre-opening minutes outside.','MAAT Museum Lisbon'],['10:00–11:20','🏛️','MAAT Museum','Focused museum visit.','MAAT architecture + temporary exhibition.','Cap it around 75–80 minutes.','MAAT Museum Lisbon'],['11:25–12:00','🥧','Pastéis de Belém','Classic pastry stop after MAAT.','Historic tiled rooms.','Try them warm with cinnamon + sugar.','Pastéis de Belém Lisbon'],['12:00–13:00','⛲','Belém highlights walk','Compact monumental-core loop.','Jerónimos exterior, Praça do Império, riverfront.','No second major paid attraction.','Jerónimos Monastery Lisbon'],['13:00–13:40','🚕','Return to Meliá + collect luggage','Ride back to Oriente and retrieve every bag.','Verify final terminal details en route.','Count all luggage.','Meliá Lisboa Oriente Lisbon'],['13:45–14:20','🛳️','Uber to Silver Muse terminal','Use only final Silversea terminal instructions.','Have passports and cruise docs ready.','Use a larger vehicle for four adults + luggage.','Lisbon Cruise Terminal'],['14:20–15:00','🎫','Check in + board Silver Muse','Board comfortably before 16:00.','Complete terminal formalities.','If delayed, cut the Belém walk first.','Lisbon Cruise Terminal'],['15:00 onward','🥂','Settle aboard','Unpack, eat, explore and verify dining.','Locate safety/muster information.','Cruise mode starts here.','Silver Muse']]}];const cruise=[['Aug 22','Casablanca','Hassan II Mosque + compact highlights','NIYA · Organic Kitchen'],['Aug 23','Tangier','Kasbah · Medina · American Legation · Grand Socco','Alma Kitchen · Dada'],['Aug 24','Cádiz','Cathedral · Central Market · La Caleta','La Verdulera · Café Noray'],['Aug 25','Gibraltar','Upper Rock · St. Michael’s Cave · Apes’ Den · Skywalk','AquaTerra'],['Aug 26','Málaga','Alcazaba · Roman Theatre · Atarazanas','The Club · NicPic'],['Aug 27','Cartagena','Roman Theatre · Calle Mayor · Concepción Castle','Old Town mixed-menu zone'],['Aug 28','Palma','La Seu · Almudaina · Old Town','Sa Cova · Temple Natura']];const checklist=['Keep airline, CP, hotel and MySilversea confirmations offline.','Carry passports, medications and valuables in hand luggage.','Download Monserrate and Regaleira tickets to more than one phone.','Confirm Silver Muse terminal and 16:00 latest check-in in final documents.','Confirm Meliá luggage storage for Aug 20.'];let day=0,view='today',done={};try{done=JSON.parse(localStorage.getItem('tripdone')||'{}')}catch{}const map=q=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q),uber=q=>'uber://riderequest?pickup=my_location&dropoff[nickname]='+encodeURIComponent(q)+'&dropoff[formatted_address]='+encodeURIComponent(q);function pt(){return new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Lisbon',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date())}function wxIcon(c){if(c===0)return'☀️';if(c<=2)return'🌤️';if(c===3)return'☁️';if(c>=61&&c<=82)return'🌧️';if(c>=95)return'⛈️';return'🌤️'}async function weather(){let h=document.getElementById('wx');if(!h)return;let P=[[38.72,-9.14,'Lisbon'],[41.15,-8.61,'Porto'],[38.8,-9.39,'Sintra']];h.innerHTML='<div class="card">Loading weather…</div>';try{let a=await Promise.all(P.map(async p=>{let j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p[0]}&longitude=${p[1]}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`)).json();return[p[2],Math.round(j.current.temperature_2m),j.current.weather_code]}));h.innerHTML=a.map(x=>`<div class="card"><div class="emoji">${wxIcon(x[2])}</div><b>${x[0]}</b><div style="font:600 22px Georgia,serif">${x[1]}°F</div></div>`).join('')}catch{h.innerHTML='<div class="card">🌤️ Weather unavailable</div>'}}function tabs(){let t=document.getElementById('tabs');t.style.display=view==='today'?'flex':'none';t.innerHTML=days.map((d,i)=>`<button class="${i===day?'on':''}" onclick="day=${i};render()">${d.date.split(', ')[1]} · ${d.place}</button>`).join('')}function nav(){['Today','Cruise','Local','List'].forEach(x=>document.getElementById('b'+x).classList.toggle('on',view===x.toLowerCase()))}function toggle(k){done[k]=!done[k];try{localStorage.setItem('tripdone',JSON.stringify(done))}catch{}render()}function today(){let d=days[day];return `<section class="card now"><small>TRIP DASHBOARD</small><h2>${d.place}</h2><p>${d.date} · Portugal time ${pt()}</p></section><div id="wx" class="wx"></div><section class="card timeline"><h2 style="font-family:Georgia,serif">${d.place} day guide</h2>${d.items.map((x,i)=>`<article class="item"><button onclick="toggle('${day}-${i}')">${done[day+'-'+i]?'✓':'○'}</button><div><b>${x[1]}</b><br><small>${x[0]}</small></div><div><h3>${x[2]}</h3><p>${x[3]}</p><div class="bits"><div><b>SEE</b>${x[4]}</div><div><b>TRY / TIP</b>${x[5]}</div></div><div class="actions"><a target="_blank" href="${map(x[6])}">↗ Directions</a><a class="uber" href="${uber(x[6])}">Uber</a></div></div></article>`).join('')}</section>`}function cruisePage(){return `<h2 style="font-family:Georgia,serif">Silver Muse port companion</h2>${cruise.map(c=>`<section class="card port"><details><summary>${c[0]} · ${c[1]}</summary><p class="muted">Extensive DIY focus</p><p><b>See & do:</b> ${c[2]}</p><p><b>Vegetarian-friendly food:</b> ${c[3]}</p><div class="actions"><a target="_blank" href="${map(c[1])}">Port map ↗</a></div></details></section>`).join('')}`}function local(){return `<h2 style="font-family:Georgia,serif">Local essentials</h2><section class="card"><p><a href="${map('Meliá Lisboa Oriente Lisbon')}">🏨 Hotel</a></p><p><a href="${map('Lisbon Cruise Terminal')}">🛳️ Cruise terminal</a></p><p><a href="${map('MAAT Museum Lisbon')}">🏛️ MAAT</a></p><p><a href="${map('Pastéis de Belém Lisbon')}">🥧 Pastéis de Belém</a></p></section>`}function list(){return `<h2 style="font-family:Georgia,serif">Departure essentials</h2><section class="card checklist">${checklist.map((x,i)=>`<label><input type="checkbox" ${done['c'+i]?'checked':''} onchange="toggle('c${i}')"><span>${x}</span></label>`).join('')}</section>`}function render(){tabs();nav();document.getElementById('app').innerHTML=view==='today'?today():view==='cruise'?cruisePage():view==='local'?local():list();if(view==='today')weather()}render();setInterval(()=>{if(view==='today')render()},60000);</script></body></html>

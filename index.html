</head><body><section class="hero"><small>MANDAVA’S EUROPE TRIP · 26’</small><h1>Mandava’s Europe Trip 26’</h1><p>Lisbon, Porto, Sintra, Belém and Silver Muse.</p></section><div id="tabs" class="tabs"></div><main id="app"></main><nav class="bottom"><button id="bToday" class="on" onclick="view='today';render()">⌂<br>Today</button><button id="bCruise" onclick="view='cruise';render()">⚓<br>Cruise</button><button id="bLocal" onclick="view='local';render()">◎<br>Local</button><button id="bList" onclick="view='list';render()">✓<br>List</button></nav><script>const days=[{date:'Mon, Aug 17',place:'Lisbon',items:[['07:45–09:00','☕','Hotel breakfast + reset','Leave bags at Meliá, eat, hydrate and keep valuables with you.','Keep passports/valuables with you.','Portuguese coffee + light breakfast.','Meliá Lisboa Oriente Lisbon'],['09:00–10:30','🌊','Parque das Nações','Walk the riverfront around Oriente and the marina.','Oriente Station roof + Tagus promenade.','Easy jet-lag buffer.','Parque das Nações Lisbon'],['11:30–12:30','🏛️','Praça do Comércio → Rua Augusta','Walk the grand river square through Baixa.','Yellow arcades, river steps, Baixa grid.','Skip Santa Justa queue.','Praça do Comércio Lisbon'],['12:30–13:30','🍕','Lunch: Lupita','Family lunch with vegetarian/vegan options.','Cais do Sodré area.','Share pizzas family-style.','Lupita Lisbon'],['13:40–14:15','🏺','Chiado + Cerâmicas na Linha','Short ceramics-shopping stop.','Portuguese ceramics and tiles.','Cap at 20–30 minutes.','Cerâmicas na Linha Lisbon'],['14:30–16:30','🏘️','Alfama + Lisbon Cathedral','Ride uphill, then walk downhill through Alfama.','Santa Luzia, tiled façades, Sé.','Wander one or two side streets.','Miradouro de Santa Luzia Lisbon'],['16:45–17:30','🌇','Senhora do Monte · optional','Broad city panorama if everyone has energy.','Castle, Baixa and Tagus view.','Ride uphill.','Miradouro da Senhora do Monte Lisbon'],['18:30–20:00','🍽️','Dinner: Rosa da Rua','Portuguese buffet-style dinner with vegetarian options.','Bairro Alto evening atmosphere.','Sample several dishes.','Rosa da Rua Lisbon']]},{date:'Tue, Aug 18',place:'Porto',items:[['08:09–10:55','🚆','First Class to Campanhã','Use the train as downtime.','Keep tickets and ID ready.','Save the main meal for Porto.','Porto Campanhã Station'],['11:05–11:35','🚕','Ride to Porto Cathedral','Go straight to the high point.','Sé terrace + panorama.','Makes the day mostly downhill.','Porto Cathedral'],['11:35–12:30','🌉','Dom Luís I → Jardim do Morro','Cross the upper deck toward Gaia.','Ribeira roofs + Douro.','Add Serra do Pilar only if moving well.','Jardim do Morro Porto'],['12:30–13:30','🥗','Veg-inclusive lunch','daTerra Baixa is the safest mixed-family choice.','Keep lunch near one hour.','Casa Guedes optional for meat eaters.','daTerra Baixa Porto'],['13:30–14:15','🌊','Ribeira waterfront','Slow down along the riverfront.','Cais da Ribeira + lower bridge.','Coffee or cold drink.','Ribeira Porto'],['14:15–15:00','⛴️','Six Bridges cruise · optional','Do it only if queues are short.','River-level city perspective.','First thing to cut if timing slips.','Ribeira Porto'],['15:00–16:20','🚶','Rua das Flores → São Bento','Walk inland and enter São Bento.','Blue-and-white azulejo panels.','Fábrica da Nata nearby.','São Bento Station Porto'],['17:25–18:40','🚕','Campanhã buffer + return train','Ride to Campanhã early.','18:40 is the hard stop.','Buy water/snacks at station.','Porto Campanhã Station']]},{date:'Wed, Aug 19',place:'Sintra',items:[['07:40–09:20','🚆','Oriente → Sintra','Take the commuter train and conserve energy.','Go straight to your transport plan.','Keep tickets downloaded.','Sintra Station Portugal'],['10:00–12:00','🌿','Monserrate Palace & Park','Give gardens and palace a real two hours.','Central hall, lawns, exotic planting.','Follow current access signs.','Monserrate Palace Sintra'],['12:45–13:40','🥙','Quick veg-inclusive lunch','Piadina’s is fast and mixed-diet friendly.','Stay near the historic center.','Vegan artisan burger is a safe option.',"Piadina's Wine & Co Sintra"],['13:40–14:15','🏘️','Historic center → Regaleira','Walk to Quinta da Regaleira and arrive early.','National Palace exterior if timing permits.','Do not join another attraction line.','Quinta da Regaleira Sintra'],['14:30–16:30','🌀','Quinta da Regaleira','The day’s fixed anchor.','Initiation Well, tunnels, grottoes, chapel.','Shoes with grip help.','Quinta da Regaleira Sintra'],['16:30–17:20','🥐','Casa Piriquita','Classic Sintra pastry stop.','Historic center atmosphere.','Share one travesseiro + one queijada.','Casa Piriquita Sintra']]},{date:'Thu, Aug 20',place:'Belém + Silver Muse',items:[['07:30–08:30','☕','Breakfast + finish packing','Eat, hydrate and have cruise documents ready.','Final safe/outlet/bathroom sweep.','Keep passports and medications in hand luggage.','Meliá Lisboa Oriente Lisbon'],['08:30–09:00','🧳','Check out + store luggage','Leave cruise luggage securely with Meliá.','Confirm every bag is tagged.','Take only a light day bag to Belém.','Meliá Lisboa Oriente Lisbon'],['09:00–09:40','🚕','Uber to Belém / MAAT','Ride directly west to MAAT.','Tagus riverfront + MAAT exterior.','Use spare pre-opening minutes outside.','MAAT Museum Lisbon'],['10:00–11:20','🏛️','MAAT Museum','Focused museum visit.','MAAT architecture + temporary exhibition.','Cap it around 75–80 minutes.','MAAT Museum Lisbon'],['11:25–12:00','🥧','Pastéis de Belém','Classic pastry stop after MAAT.','Historic tiled rooms.','Try them warm with cinnamon + sugar.','Pastéis de Belém Lisbon'],['12:00–13:00','⛲','Belém highlights walk','Compact monumental-core loop.','Jerónimos exterior, Praça do Império, riverfront.','No second major paid attraction.','Jerónimos Monastery Lisbon'],['13:00–13:40','🚕','Return to Meliá + collect luggage','Ride back to Oriente and retrieve every bag.','Verify final terminal details en route.','Count all luggage.','Meliá Lisboa Oriente Lisbon'],['13:45–14:20','🛳️','Uber to Silver Muse terminal','Us function dayIntroText(i){return[['MON, AUG 17 · ARRIVAL DAY','Lisbon · curated','Land, reset and explore Lisbon without overloading arrival day.'],['TUE, AUG 18 · PORTO DAY TRIP','Porto · curated','A high-to-low walking route built around your confirmed train times.'],['WED, AUG 19 · SINTRA DAY','Sintra · curated','Gardens, Regaleira and a realistic pace with transport buffers.'],['THU, AUG 20 · BELÉM + EMBARKATION','Belém · curated','MAAT and Belém first, then retrieve luggage and board Silver Muse early.']][i]}
function agendaItemHtml(x,i,isDone){return `<article class="item ${isDone?'done':''}"><button aria-label="${isDone?'Mark incomplete':'Mark complete'}" onclick="toggle('${day}-${i}')">${isDone?'✓':'○'}</button><div><b>${x[1]}</b><br><small>${x[0]}</small></div><div><h3>${x[2]}</h3><p>${x[3]}</p><div class="bits"><div><b>SEE</b>${x[4]}</div><div><b>TRY / TIP</b>${x[5]}</div></div><div class="actions"><a target="_blank" href="${map(x[6])}">↗ Directions</a><a class="uber" href="${uber(x[6])}">Uber</a></div></div></article>`}
function agendaItemsHtml(d){let completed=[],remaining=[];d.items.forEach((x,i)=>(done[day+'-'+i]?completed:remaining).push([x,i]));let html='';if(completed.length){html+=`<div class="agendaDivider doneDivider"><span>✓ COMPLETED</span><small>${completed.length} done</small></div>`+completed.map(v=>agendaItemHtml(v[0],v[1],true)).join('')}if(remaining.length){html+=`<div class="agendaDivider aheadDivider"><span>${completed.length?'UP NEXT':'AGENDA'}</span><small>${remaining.length} remaining</small></div>`+remaining.map(v=>agendaItemHtml(v[0],v[1],false)).join('')}else{html+=`<div class="allDone">✓ DAY COMPLETE · Everything on today’s agenda is checked off</div>`}return html}
function today(){let d=days[day],live=liveState(),intro=dayIntroText(day);return `<section class="todayDash"><div class="todayDashTop"><div><small>${live.label}</small><h2>${live.title}</h2><p class="sub">${live.sub}</p></div><div class="todayClock"><strong>${live.clock}</strong><span>Portugal time</span></div></div><div class="dashPills"><span>${live.pill}</span><span>${live.place}</span></div></section><div class="sectionHead"><h3>WEATHER FOR YOUR VISIT</h3><button onclick="weather()">↻ Refresh</button></div><div id="wx" class="wx"></div><div class="sectionHead"><h3>CRITICAL ANCHORS</h3><span>Portugal time</span></div><div class="anchorRail">${anchorHtml()}</div><div class="daySwitch">${days.map((x,i)=>`<button class="${i===day?'on':''}" onclick="day=${i};render()"><small>${x.date}</small><b>${x.place}</b></button>`).join('')}</div><section class="dayIntro"><small>${intro[0]}</small><h2>${intro[1]}</h2><p>${intro[2]}</p></section><section class="timeline">${agendaItemsHtml(d)}</section>${foodSection()}`}function cruisePage(){return `<section class="cruiseHero"><small>SILVER MUSE · AUG 22—28</small><h2>Port Companion</h2><p>Detailed self-guided plans, must-see stops and vegetarian-inclusive food choices without cluttering the day view.</p></section><div class="cruiseLegend"><span>● DIY where practical</span><span>● Prebook key attractions</span><span>● Keep ship buffer</span></div>${cruiseDetails.map((d,i)=>`<article class="portCardRich"><button class="portTopRich" onclick="togglePort(${i})"><div><small>${d.date} · ${d.hours}</small><h3>${d.port}</h3><p>${d.tag}</p></div><span id="pc-${i}">${i===0?'⌃':'⌄'}</span></button><div id="pb-${i}" class="portBodyRich ${i===0?'open':''}"><p class="portSummary">${d.summary}</p>${d.booked?`<div class="bookedBadge">✓ ${d.booked}</div>`:''}${d.dining?`<div class="diningBadge">🍽 Reserved dining onboard tonight</div>`:''}<div class="portPlan">${d.plan.map(x=>`<div><time>${x[0]}</time><section><b>${x[1]}</b><span>${x[2]}</span></section></div>`).join('')}</div><div class="exploreBlock"><small>✨ SEE & DO</small><div class="optionList">${d.sights.map(x=>`<a class="optionCard" target="_blank" href="${map(x[3])}"><span>${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div><i>↗</i></a>`).join('')}</div></div><div class="exploreBlock"><small>🍴 FOOD · VEGETARIAN-INCLUSIVE</small><div class="optionList">${d.eats.map(x=>`<a class="optionCard" target="_blank" href="${map(x[4])}"><span>${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small><p>${x[3]}</p></div><i>↗</i></a>`).join('')}</div></div><div class="shipRule">Aim to be back near the ship well before published all-aboard; final Silversea notices are authoritative.</div></div></article>`).join('')}`}function togglePort(i){let b=document.getElementById('pb-'+i),c=document.getElementById('pc-'+i);if(!b)return;b.classList.toggle('open');if(c)c.textContent=b.classList.contains('open')?'⌃':'⌄'}function local(){return `<h2 style="font-family:Georgia,serif">Local essentials</h2><section class="card"><p><a href="${map('Meliá Lisboa Oriente Lisbon')}">🏨 Hotel</a></p><p><a href="${map('Lisbon Cruise Terminal')}">🛳️ Cruise terminal</a></p><p><a href="${map('MAAT Museum Lisbon')}">🏛️ MAAT</a></p><p><a href="${map('Pastéis de Belém Lisbon')}">🥧 Pastéis de Belém</a></p></section>`}function list(){return `<h2 style="font-family:Georgia,serif">Departure essentials</h2><section class="card checklist">${checklist.map((x,i)=>`<label><input type="checkbox" ${done['c'+i]?'checked':''} onchange="toggle('c${i}')"><span>${x}</span></label>`).join('')}</section>`}function render(){tabs();nav();document.getElementById('app').innerHTML=view==='today'?today():view==='cruise'?cruisePage():view==='local'?local():list();if(view==='today')weather()}render();setInterval(()=>{if(view==='today')render()},60000);</script></body></html>

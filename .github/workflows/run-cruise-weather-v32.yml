name: Apply cruise port weather tiles
on:
  push:
    paths:
      - '.github/workflows/run-cruise-weather-v32.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cruise weather patch
        run: python scripts/cruise_weather.py
      - name: Validate generated JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('index.html').read_text()
          assert 'v32-cruise-port-weather' in s
          assert s.count('portWeatherWrap') >= 2
          assert 'loadAllCruiseWeather' in s
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          Path('/tmp/app.js').write_text(js)
          r=subprocess.run(['node','--check','/tmp/app.js'])
          sys.exit(r.returncode)
          PY
      - name: Commit generated site
        run: |
          git config user.name 'Trip App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add weather tiles to every cruise port' || exit 0
          git push

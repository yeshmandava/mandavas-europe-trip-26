name: Apply Today reference UI v2

on:
  push:
    paths:
      - '.github/workflows/run-today-ui-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix replacement callback in patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/today_ui.py')
          s=p.read_text()
          old='s=re.sub(r"function today\\(\\)\\{.*?\\}function cruisePage\\(\\)",helpers+new_today+"function cruisePage()",s,count=1,flags=re.S)'
          new='s=re.sub(r"function today\\(\\)\\{.*?\\}function cruisePage\\(\\)",lambda m: helpers+new_today+"function cruisePage()",s,count=1,flags=re.S)'
          if old not in s: raise SystemExit('Expected replacement line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply Today UI patch
        run: python scripts/today_ui.py
      - name: Validate generated app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          for marker in ['v30-today-reference-ui','uber://riderequest','dropoff%5Blatitude%5D','HAPPENING NOW','WEATHER FOR YOUR VISIT','CRITICAL ANCHORS','function cruisePage()','function local()','function list()']:
              assert marker in s, marker
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          for i,js in enumerate(scripts): Path(f'/tmp/app-{i}.js').write_text(js)
          print('Validated',len(scripts),'script block(s)')
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done
      - name: Commit generated site only
        run: |
          git config user.name 'Trip App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh Today page to reference design'
          git push

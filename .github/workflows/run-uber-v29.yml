name: Run Uber v29 patch

on:
  push:
    paths:
      - '.github/workflows/run-uber-v29.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_uber.py
      - run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'v29-uber-riderequest-coordinates' in s
          for i,js in enumerate(re.findall(r'<script>(.*?)</script>',s,re.S)):
              p=Path('/tmp')/f'app-{i}.js'; p.write_text(js)
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done
      - run: |
          git config user.name 'Trip App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Use Uber riderequest with exact dropoff coordinates'
          git push

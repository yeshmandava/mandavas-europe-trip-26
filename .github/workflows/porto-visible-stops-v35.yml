name: Fix Porto itinerary additions visibly
on:
  push:
    paths:
      - '.github/workflows/porto-visible-stops-v35.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Porto itinerary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('v33-no-list-page','v35-porto-visible-stops')
          old="""['11:35–12:30','🌉','Dom Luís I → Jardim do Morro','Cross the upper deck toward Gaia.','Ribeira roofs + Douro.','Add Serra do Pilar only if moving well.','Jardim do Morro Porto'],['12:30–13:30','🥗','Veg-inclusive lunch','daTerra Baixa is the safest mixed-family choice.','Keep lunch near one hour.','Casa Guedes optional for meat eaters.','daTerra Baixa Porto'],['13:30–14:15','🌊','Ribeira waterfront','Slow down along the riverfront.','Cais da Ribeira + lower bridge.','Coffee or cold drink.','Ribeira Porto'],['14:15–15:00','⛴️','Six Bridges cruise · optional','Do it only if queues are short.','River-level city perspective.','First thing to cut if timing slips.','Ribeira Porto'],['15:00–16:20','🚶','Rua das Flores → São Bento','Walk inland and enter São Bento.','Blue-and-white azulejo panels.','Fábrica da Nata nearby.','São Bento Station Porto'],['17:25–18:40','🚕','Campanhã buffer + return train','Ride to Campanhã early.','18:40 is the hard stop.','Buy water/snacks at station.','Porto Campanhã Station']"""
          new="""['11:35–12:20','🌉','Dom Luís I Bridge → Jardim do Morro','Cross the upper deck toward Gaia, then take in the Jardim do Morro panorama.','Ribeira roofs, Douro and the bridge itself.','Add Serra do Pilar only if moving well.','Jardim do Morro Porto'],['12:20–13:10','🥗','Veg-inclusive lunch','daTerra Baixa is the safest mixed-family choice.','Keep lunch near 50 minutes.','Casa Guedes optional for meat eaters.','daTerra Baixa Porto'],['13:10–13:45','🌊','Ribeira waterfront','Slow down along the riverfront before heading uphill.','Cais da Ribeira + lower bridge views.','Coffee or cold drink if needed.','Ribeira Porto'],['13:45–14:20','⛪','Torre dos Clérigos','Walk via Rua das Flores to Porto’s landmark baroque tower.','Clérigos Church and tower exterior; climb only if queues are short.','Skip the climb if timing is tight.','Torre dos Clérigos Porto'],['14:25–14:55','🚉','São Bento Station','Continue east for the famous azulejo-lined station hall.','Blue-and-white historical tile panels.','A quick high-value stop on the route.','São Bento Station Porto'],['15:00–15:30','💙','Chapel of Souls','Walk to the striking blue-tiled Capela das Almas beside Rua de Santa Catarina.','Photograph the azulejo-covered exterior and step inside if open.','This pairs naturally with Mercado do Bolhão a few minutes away.','Chapel of Souls Porto'],['15:35–16:15','🛍️','Mercado do Bolhão','Browse the restored historic market for local produce, snacks and atmosphere.','Market hall, local vendors and Portuguese products.','Good place for a snack without a full sit-down meal.','Mercado do Bolhão Porto'],['16:15–17:10','🚕','Ride to Campanhã + station buffer','Leave central Porto with a generous train buffer.','Campanhã departure boards and platform.','Do not sacrifice the 18:40 train for another stop.','Porto Campanhã Station'],['17:25–18:40','🚆','Return train to Lisbon','Board at Campanhã with time to spare.','Keep tickets and ID ready.','18:40 is the hard departure.','Porto Campanhã Station']"""
          if old not in s:
              raise SystemExit('Current Porto itinerary block not found; refusing unsafe patch')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate visible stops
        run: |
          grep -q "'Chapel of Souls'" index.html
          grep -q "'Torre dos Clérigos'" index.html
          grep -q "'Mercado do Bolhão'" index.html
          grep -q "'Dom Luís I Bridge → Jardim do Morro'" index.html
          grep -q 'v35-porto-visible-stops' index.html
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html').read()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          for i,js in enumerate(scripts):
              open(f'/tmp/check{i}.js','w').write(js)
          print(len(scripts))
          PY
          for f in /tmp/check*.js; do node --check "$f"; done
      - name: Commit
        run: |
          git config user.name 'Trip App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Show Chapel of Souls and Porto additions in itinerary' || exit 0
          git push

name: Fix Uber destination deep links

on:
  push:
    paths:
      - '.github/workflows/uber-link-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Uber universal link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const map=q=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q),uber=q=>'https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff%5Bnickname%5D='+encodeURIComponent(q)+'&dropoff%5Bformatted_address%5D='+encodeURIComponent(q);"
          new="const map=q=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q),uber=q=>'https://m.uber.com/looking?pickup=my_location&drop%5B0%5D='+encodeURIComponent(JSON.stringify({addressLine1:q,addressLine2:q}));"
          if old not in s:
              raise SystemExit('Expected Uber helper not found; refusing unsafe patch')
          s=s.replace(old,new,1)
          s=s.replace('content=\"v26-git-rich\"','content=\"v27-uber-looking-drop-json\"',1)
          p.write_text(s)
          PY
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          for i,js in enumerate(scripts): Path(f'/tmp/app-{i}.js').write_text(js)
          print(f'Validated extraction of {len(scripts)} script block(s)')
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done
      - name: Commit patched app
        run: |
          git config user.name 'Trip App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Use Uber looking links with destination JSON'
          git push

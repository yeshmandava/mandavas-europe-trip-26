name: Apply rich trip UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rich-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate trip app
        env:
          PATCH_B64: >-
            
        run: |
          python - <<'PY'
          import os, base64, gzip
          from pathlib import Path
          Path('/tmp/patch.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))
          PY
          python /tmp/patch.py
      - name: Commit validated app
        run: |
          git config user.name 'trip-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add rich food, Uber links and cruise port companion'
            git push
          fi

name: Apply Today reference UI

on:
  push:
    paths:
      - '.github/workflows/run-today-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Today UI patch
        run: python scripts/today_ui.py
      - name: Validate JavaScript and required markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'v30-today-reference-ui' in s
          assert 'uber://riderequest' in s
          assert 'CRITICAL ANCHORS' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          for i,js in enumerate(scripts): Path(f'/tmp/app-{i}.js').write_text(js)
          print('script blocks',len(scripts))
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done
      - name: Commit generated site
        run: |
          git config user.name 'Trip App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh Today page to reference design'
          git push

name: Seed production baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-production.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull current stable production HTML
        run: |
          curl -fL --retry 3 'https://mandavas-europe-trip-26.vercel.app/?seed=github-baseline' -o index.html
          grep -q "Mandava’s Europe Trip 26’" index.html
      - name: Commit stable baseline
        run: |
          git config user.name 'trip-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Baseline already current'
          else
            git commit -m 'Seed stable production baseline'
            git push
          fi
